name: Deploy MYCAR STAGING Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4

      - name: Fetch public MYCAR develop branch (read-only)
        run: |
          git clone --depth 1 --branch develop https://github.com/yudthakarnk-commits/mycar.git source

      - name: Prepare staging-only static site
        env:
          MYCAR_STAGING_PUBLISHABLE_KEY: ${{ secrets.MYCAR_STAGING_PUBLISHABLE_KEY }}
        run: python3 scripts/build_staging.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

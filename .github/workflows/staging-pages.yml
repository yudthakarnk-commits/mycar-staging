name: Deploy MYCAR STAGING Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4

      - name: Fetch public MYCAR develop branch (read-only)
        run: |
          git clone --depth 1 --branch develop https://github.com/yudthakarnk-commits/mycar.git source

      - name: Prepare staging-only static site
        env:
          MYCAR_STAGING_PUBLISHABLE_KEY: ${{ secrets.MYCAR_STAGING_PUBLISHABLE_KEY }}
        run: python3 scripts/build_staging.py

      - name: Set up Node for isolated Paddle device QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build isolated Paddle device QA
        working-directory: paddle-local
        run: |
          set -euo pipefail
          npm install --save-exact @paddleocr/paddleocr-js@0.4.2 vite@6.3.5 playwright@1.56.1
          node parser-test.mjs
          mkdir -p public/models
          base=https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0
          for model in PP-OCRv5_mobile_det_onnx_infer.tar PP-OCRv5_mobile_rec_onnx_infer.tar; do
            curl --fail --location --retry 3 --max-time 180 "$base/$model" -o "public/models/$model"
            tar -tf "public/models/$model" >/dev/null
          done
          npx vite build --base ./
          python3 generate-offline.py
          node --check dist/service-worker.js
          test -s dist/index.html
          grep -q 'NO DATABASE' dist/index.html
          mkdir -p ../site/paddle-device-qa/
          cp -R dist/. ../site/paddle-device-qa/
          test -s ../site/paddle-device-qa/models/PP-OCRv5_mobile_det_onnx_infer.tar
          test -s ../site/paddle-device-qa/models/PP-OCRv5_mobile_rec_onnx_infer.tar
          test -s ../site/paddle-device-qa/offline-manifest.json
          test -s ../site/paddle-device-qa/service-worker.js
          mkdir -p ../site/paddle-integrated/
          cp -R dist/. ../site/paddle-integrated/
          python3 generate-offline.py ../site/paddle-integrated mycar-paddle-integrated:
          node --check ../site/paddle-integrated/service-worker.js
          node ../receipt-guard-test.mjs
          node --check ../site/receipt-integrated-ui.js
          node --check ../site/app.js
          cd ..
          python3 scripts/verify_final_staging.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
